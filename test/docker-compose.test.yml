# E2E test stack (SPEC §12). Spins up the production app container plus a
# separate Playwright container so browser dependencies stay out of the app
# image. Run from this directory:
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#
# The `playwright` service's exit code is the test result. Tear down with:
#
#   docker compose -f docker-compose.test.yml down -v
#
# Note: the `app` service builds from the repo-root Dockerfile (produced by
# fin-vix4). Tests run with LLM_MOCK=true and no MASSIVE_API_KEY, so the LLM is
# deterministic-mock and market data comes from the in-process simulator.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: "" # empty -> built-in market simulator
      OPENROUTER_API_KEY: "" # unused under LLM_MOCK
      ENABLE_TEST_RESET: "true" # exposes /api/test/reset for per-test isolation
    expose:
      - "8000"
    # Use a tmpfs/ephemeral DB so every test run starts from the fresh seed
    # (default watchlist + $10k). No named volume -> clean state each run.
    tmpfs:
      - /app/db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: "http://app:8000"
      CI: "true"
    working_dir: /e2e
    volumes:
      - ./:/e2e
    # Install deps against the pinned versions, then run the suite. The volume
    # mount is writable for node_modules + the HTML report/artifacts.
    command: >
      bash -lc "npm ci --no-audit --no-fund && npx playwright test"
